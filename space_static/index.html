<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlexNet CIFAR-100</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="header">
      <p class="eyebrow">CIFAR-100 · 100 classes</p>
      <h1>AlexNet 图片分类</h1>
      <p class="subtitle">上传图片，在浏览器里用 ONNX Runtime 推理，输出置信度最高的 5 个类别。</p>
    </header>

    <section class="workspace">
      <div class="panel">
        <label id="dropzone" class="dropzone">
          <input id="file" type="file" accept="image/*">
          <img id="preview" alt="图片预览" hidden>
          <span id="placeholder" class="placeholder">
            <span>点击或拖拽图片到这里</span>
            <small>支持 JPG / PNG，图片会被缩放到 32 × 32</small>
          </span>
        </label>
        <button id="run" disabled>开始预测</button>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>Top-5</h2>
          <span id="status">模型加载中...</span>
        </div>
        <div id="results" class="results"></div>
      </div>
    </section>

    <aside class="info">
      <div>
        <h2>模型信息</h2>
        <dl>
          <div><dt>数据集</dt><dd>CIFAR-100（100 类）</dd></div>
          <div><dt>测试准确率</dt><dd>63.01%</dd></div>
          <div><dt>输入尺寸</dt><dd>32 × 32</dd></div>
          <div><dt>参数量</dt><dd>7,025,316</dd></div>
        </dl>
      </div>
      <div>
        <h2>链接</h2>
        <p><a href="https://github.com/Wait4theWind/alexnet-cifar100" target="_blank" rel="noreferrer">GitHub 仓库</a></p>
        <p><a href="https://huggingface.co/bbbegemot/alexnet-cifar100" target="_blank" rel="noreferrer">模型权重</a></p>
      </div>
      <div>
        <h2>说明</h2>
        <p>模型只在 32 × 32 的 CIFAR-100 图片上训练，对真实照片的泛化能力有限，结果仅用于演示。</p>
        <p>首次加载需要下载约 28 MB 的模型，之后浏览器会缓存。</p>
      </div>
    </aside>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
